[package]
name = "sona"
version = "1.1.0"
description = "Sona"
authors = ["Aktan Azat"]
edition = "2021"
license = "MIT"
default-run = "sona"

[features]
cloud-realtime = [
  "dep:tokio-tungstenite",
  "tokio/net",
  "tokio/sync",
  "tokio/time",
]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library distinct from the application binary on
# Windows.
name = "sona_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
window-vibrancy = "0.8.0"
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.8.2"
libc = "0.2"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
parking_lot = "0.12"
log = "0.4.25"
env_filter = "0.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false, features = ["connect", "rustls-tls-native-roots"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
ed25519-dalek = "3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ndarray = "0.17"
rustfft = "6.4.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray"] }
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
url = "2"
psl = "2"
csv = "1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
# The IANA name of the host zone, for the corpus card's `now:` line. Already
# in the build as chrono's own way of reading `Local`; named here so the card
# can print the zone rather than only its offset.
iana-time-zone = "0.1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false }
handy-keys = "0.3.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["uuid"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
# Tilde-pinned to one minor: `tauri build` errors out unless this crate and the
# `@tauri-apps/plugin-dialog` npm package agree on major.minor. A plain caret
# here let cargo float to 2.7 while npm stayed on 2.6, which broke the build.
tauri-plugin-dialog = "~2.7"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }
aes-gcm = "0.10"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
rtrb = "0.3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Static (bag-of-token) sentence embeddings for history semantic recall. Pure
# Rust: safetensors + a tokenizer, no ONNX session, no GPU, no ANE.
# `local-only` compiles out the crate's hf-hub/ureq downloader so this
# dependency can never open a socket even if feature unification turns the
# crate's default features back on — the model arrives through Sona's own
# pinned-revision + sha256 path (managers/history/semantic.rs). `fancy-regex`
# selects the tokenizer's pure-Rust regex engine instead of building
# oniguruma's C library.
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only", "fancy-regex"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"

[target.'cfg(windows)'.dependencies]
# ONNX Runtime on Windows is CPU-only (no ort-directml).
# The DirectML EP was experimental and, more importantly, pulled in pyke's
# prebuilt ONNX Runtime which is compiled with a global /arch:AVX2 baseline that
# executes BMI2/AVX in a static initializer and crashes at process startup on any
# pre-Haswell CPU (Sandy/Ivy Bridge, older AMD). Dropping the feature means we
# link a baseline ONNX Runtime (dynamically, via ORT_LIB_LOCATION in build.yml)
# with proper runtime CPU dispatch. Base `transcribe-rs` (features = ["onnx"])
# is inherited here, so Parakeet/Moonshine/etc. still run on CPU.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Memory",
  # File identity + ChangeTime for model install receipts
  # (GetFileInformationByHandleEx).
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  # UI Automation drives context capture: the focused element's name, value and
  # control type, bounded by the client's transaction timeout.
  "Win32_UI_Accessibility",
] }
libloading = "0.8.9"
keyring = { version = "=3.6.1", default-features = false, features = ["windows-native"] }
winreg = "0.55"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# sona.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "0.2.0", default-features = false, features = ["metal"] }
# CoreML stays a per-session experiment. Cargo unifies these target-only
# features with the CPU baseline above only for macOS builds.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "coreml"] }
transcribe-rs = { version = "0.3.8", features = ["onnx", "ort-coreml"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGWindow",
] }
objc2-service-management = "0.3.2"
# Accessibility (ApplicationServices/HIServices) drives context capture and the
# preferred delivery path: reading the focused control and inserting text into
# it. Feature-pared to the AXUIElement surface actually used.
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXUIElement",
  "AXError",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFString",
  "CFURL",
] }
# Automatic meeting detection. EventKit reads upcoming events, CoreAudio watches
# the default input device, UserNotifications delivers the prompt, and block2
# carries the completion handlers both frameworks require. Feature-pared to the
# surface actually used; objc2-user-notifications, objc2-core-audio, and block2
# were already in the lockfile as transitive dependencies at these versions.
objc2-event-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "EKCalendar",
  "EKCalendarItem",
  "EKEvent",
  "EKEventStore",
  "EKObject",
  "EKParticipant",
  # D22 writes open commitments into a "Sona" reminders list: EKReminder is the
  # row, and EKSource is how a newly created list is homed on the same account
  # as the operator's existing reminders instead of nowhere.
  "EKReminder",
  "EKSource",
  "EKTypes",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2",
  "AudioHardware",
] }
block2 = "0.6.2"

keyring = { version = "=3.6.1", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
# AT-SPI2 is a D-Bus service, and this is the D-Bus client Tauri's Linux stack
# already links. Context capture reads the focused accessible through it; the
# typed `atspi` wrapper would add a crate and an async runtime for the same
# five method calls.
zbus = "5"
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }
keyring = { version = "=3.6.1", default-features = false, features = ["sync-secret-service"] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (Handy #1710). `handy` = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.11.5", features = ["test"] }
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
