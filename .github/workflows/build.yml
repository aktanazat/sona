name: Native Mac package

on:
  workflow_call:
    inputs:
      release-version:
        description: Expected app/core version, without the v prefix
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: native-mac-arm64
      - name: Install build tools
        run: brew install cmake
      - name: Install script dependencies
        run: bun install --frozen-lockfile
      - name: Build and stage both private helpers
        run: |
          unset CARGO_TARGET_DIR
          bun run prepare:agent-hook -- aarch64-apple-darwin
          bun run prepare:cleanup-runtime -- aarch64-apple-darwin
      - name: Build release recording engine
        run: |
          unset CARGO_TARGET_DIR
          bun run build
      - name: Build native Mac app with its engine
        run: |
          xcodebuild -project macos/Sona.xcodeproj -scheme Sona \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/sona-mac" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            SONA_CORE_TARGET_DIR="$GITHUB_WORKSPACE/src-tauri/target" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Inspect complete native app and helpers
        env:
          EXPECTED_VERSION: ${{ inputs.release-version }}
        run: |
          bash macos/scripts/inspect-package.sh app \
            "$RUNNER_TEMP/sona-mac/Build/Products/Release/Sona.app" arm64 "$EXPECTED_VERSION"
      - name: Package unsigned development artifact
        run: |
          mkdir -p "$RUNNER_TEMP/sona-artifact"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/sona-mac/Build/Products/Release/Sona.app" \
            "$RUNNER_TEMP/sona-artifact/Sona-macos-arm64-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sona-macos-arm64-unsigned
          path: ${{ runner.temp }}/sona-artifact/Sona-macos-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 30
