name: "code quality"
# No `paths` filter: every check in this job reads the whole tree. `prettier
# --check .` covers markdown and JSON, and the anti-slop gate lints `src/**`,
# `scripts/**`, `.nix/scripts/**`, `tests/**`, and the root config files. A
# path list would have to name all of them, and would silently stop gating the
# day someone adds a directory the linter picks up.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check Sona identity
        run: bun run check:identity

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check

      - name: Run script tests
        run: bun run test:scripts

      # The MCP server is a standalone package with its own lockfile — the
      # scripts install it before they run, and both run here because `bun test`
      # transpiles without type-checking, so only tsc sees a dead import.
      - name: Typecheck the Sona MCP server
        run: bun run typecheck:mcp

      - name: Run MCP server tests
        run: bun run test:mcp

      - name: Run anti-slop gate
        run: bun run lint:anti-slop

  native-onboarding:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run native onboarding checks
        run: bash scripts/check-onboarding.sh
