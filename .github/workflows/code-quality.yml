name: Code quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts-and-core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check Sona identity
        run: bun run check:identity
      - name: Check formatting
        run: bun run format:check
      - name: Test preparation scripts
        run: bun run test:scripts
      - name: Typecheck the Sona MCP server
        run: bun run typecheck:mcp
      - name: Test the Sona MCP server
        run: bun run test:mcp
      - name: Run script anti-slop gate
        run: bun run lint:anti-slop

  native-onboarding:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run native onboarding checks
        run: bash scripts/check-onboarding.sh
