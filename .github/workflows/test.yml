name: Core tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src-tauri/**
      - scripts/**
      - package.json
      - bun.lock
      - .github/workflows/test.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: macos-26
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: native-core-tests
      - name: Install build and media tools
        run: brew install cmake ffmpeg
      - name: Install script dependencies
        run: bun install --frozen-lockfile
      - name: Prepare debug helper and cleanup runtime
        run: |
          unset CARGO_TARGET_DIR
          bun run prepare:agent-hook -- aarch64-apple-darwin --debug
          bun run prepare:cleanup-runtime -- aarch64-apple-darwin
      - name: Test recording engine and agent hook
        run: |
          unset CARGO_TARGET_DIR
          bun run test:backend
          bun scripts/cargo-target-dir.ts cargo test --manifest-path src-tauri/Cargo.toml --bin sona-agent-hook
