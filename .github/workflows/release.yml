name: Native Mac draft release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form vX.Y.Z.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release-version: ${{ needs.version.outputs.version }}

  draft:
    needs: [version, mac]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sona-macos-arm64-unsigned
          path: artifact
      - name: Attach unsigned Mac build to a draft
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const name = 'Sona-macos-arm64-unsigned.zip';
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error('Refusing to change an already-published release.');
            }
            const body = 'Unsigned Apple silicon development build of the native macOS app, including its recording engine and private helpers. Requires macOS 15 or later.\n\nThis is not a Developer ID-signed or notarized distribution. Gatekeeper may block it, and the camera extension requires matching Apple signing and provisioning. Do not treat it as an install-ready release.\n\niPhone archive and App Store export remain manual; no iPhone build is attached.';
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Sona ${process.env.RELEASE_VERSION} — unsigned Mac build`,
                body, draft: true, prerelease: false,
              }));
            } else {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, body,
                name: `Sona ${process.env.RELEASE_VERSION} — unsigned Mac build`,
              });
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            const previous = assets.find(item => item.name === name);
            if (previous) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: previous.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name,
              data: fs.readFileSync(`artifact/${name}`),
            });
